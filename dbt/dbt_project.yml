# Minimal project config so `dbt build` works out of the box.
# Requires dbt-utils:  packages.yml ->  - package: dbt-labs/dbt_utils
#                                         version: [">=1.0.0", "<2.0.0"]

name: experimentation_framework
version: "1.0.0"
config-version: 2

profile: experimentation_framework

model-paths: ["models"]

vars:
  experiment_id: autoscaling_tip_onboarding_v1
  experiment_start: "2026-05-01"
  experiment_end: "2026-05-29"      # 28-day enrollment window

models:
  experimentation_framework:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
